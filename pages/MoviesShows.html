<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie Player</title>
  <style>
    :root {
      --title1: #3f7be0;
      --title2: #1d4ea6;
      --chrome1: #a8c4f6;
      --chrome2: #739adf;
      --chrome3: #4e74c7;
      --chrome4: #274a92;
      --chrome5: #18376f;
      --text: #f3f7ff;
      --line: #0d234a;
      --panel: #dfeafd;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #3b5fa9 0%, #243d73 25%, #0e1836 100%);
      font-family: Tahoma, Verdana, Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
      letter-spacing: 0.01em;
    }

    .player {
      width: min(96vw, 1500px);
      height: min(96vh, 1050px);
      background: linear-gradient(180deg, var(--chrome1) 0%, var(--chrome2) 18%, var(--chrome3) 52%, var(--chrome4) 78%, var(--chrome5) 100%);
      border: 2px solid rgba(9, 23, 56, 0.9);
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.55);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
      position: relative;
    }

    .player::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0));
      pointer-events: none;
    }

    .titlebar {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 10px;
      background: linear-gradient(180deg, var(--title1), var(--title2));
      border-bottom: 1px solid rgba(10, 26, 63, 0.9);
      font-size: 12px;
      user-select: none;
      position: relative;
      z-index: 1;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .app-icon {
      width: 13px;
      height: 13px;
      border: 1px solid rgba(220, 233, 255, 0.9);
      border-radius: 3px;
      background: linear-gradient(135deg, #ffffff, #c2d6ff 20%, #7aa5eb 48%, #3c65c5 100%);
      box-shadow: inset 0 0 0 1px rgba(21, 60, 126, 0.35);
    }

    .title-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 700;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      letter-spacing: 0.02em;
    }

    .window-controls {
      display: flex;
      gap: 4px;
    }

    .wc {
      width: 18px;
      height: 18px;
      border: 1px solid #17356d;
      border-radius: 4px;
      background: linear-gradient(180deg, #edf4ff, #b7cefb 58%, #8aa9eb);
      color: #17305f;
      font: 700 12px/16px Arial, sans-serif;
      text-align: center;
      padding: 0;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .wc:hover {
      background: linear-gradient(180deg, #ffffff, #cfe0ff 58%, #abc3f5);
      transform: translateY(-1px);
    }

    .menu {
      display: flex;
      gap: 12px;
      padding: 5px 12px 6px;
      background: linear-gradient(180deg, #dfeaff, #c5d9f8);
      color: #1a2f5f;
      font-size: 11px;
      border-bottom: 1px solid rgba(101, 129, 191, 0.9);
      user-select: none;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .menu div {
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 3px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .menu div:hover {
      background: linear-gradient(180deg, #6f95eb, #3f67bf);
      color: #fff;
    }

    .screen-wrap {
      padding: 10px 12px 6px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .screen {
      position: relative;
      flex: 1;
      min-height: 0;
      background: linear-gradient(180deg, #050d1d, #000000);
      border: 2px solid rgba(227, 235, 255, 0.85);
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(15, 43, 95, 0.9), 0 2px 10px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
      filter: saturate(1.08) contrast(1.05);
    }

    .overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 15px 13px;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.8));
      font-size: 14px;
      line-height: 1.3;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      border-top: 1px solid rgba(255,255,255,0.12);
    }

    .statusbar {
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #eef4ff;
      background: linear-gradient(180deg, #365ca7, #213e7d 58%, #1a3367);
      border-top: 1px solid rgba(149, 179, 239, 0.95);
      border-bottom: 1px solid rgba(20, 45, 95, 0.95);
      border-radius: 0 0 8px 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    .controls {
      padding: 12px 14px 14px;
      background: linear-gradient(180deg, #90afe8, #6c90d6 52%, #5d7cc0 100%);
      border-top: 1px solid rgba(180, 203, 248, 0.9);
      display: grid;
      grid-template-rows: auto auto;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .big-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .btn {
      border: 1px solid #173b7d;
      border-radius: 8px;
      background: linear-gradient(180deg, #f4f8ff, #bed1f7 52%, #8eaee4);
      color: #17315d;
      font-size: 14px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), 0 3px 8px rgba(18, 41, 78, 0.12);
      min-height: 42px;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 0;
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
    }

    .btn.play {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .btn:hover {
      background: linear-gradient(180deg, #ffffff, #d4e3ff 52%, #a3c0ee);
      filter: brightness(1.02);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .bottom-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .seek-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .label {
      font-size: 10px;
      color: #eef4ff;
      text-shadow: 0 1px 0 rgba(23, 48, 95, 0.75);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .seek {
      width: 100%;
      height: 15px;
      border: 1px solid #183b7a;
      border-radius: 999px;
      background: linear-gradient(180deg, #dfeafc, #c7d7f7);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      box-shadow: inset 0 1px 3px rgba(20, 37, 70, 0.15);
    }

    .seek-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #95fdfd 0%, #65b6ff 50%, #3d82ff 100%);
      border-radius: 999px 0 0 999px;
      transition: width 0.1s linear;
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.25);
    }

    .hint {
      font-size: 10px;
      color: #edf4ff;
      text-align: right;
      white-space: nowrap;
      align-self: center;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 0 rgba(23, 48, 95, 0.7);
    }

    @media (max-width: 700px){
      .player {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }

      .screen {
        border-radius: 5px;
      }

      .big-controls {
        grid-template-columns: 1fr;
      }

      .bottom-row {
        grid-template-columns: 1fr;
      }

      .hint {
        text-align: left;
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <div class="player">
    <div class="titlebar">
      <div class="title-left">
        <div class="app-icon"></div>
        <div class="title-text">Windows Media Player</div>
      </div>
      <div class="window-controls">
        <div class="wc" onclick="alert('Minimize functionality')">_</div>
        <div class="wc" onclick="alert('Maximize functionality')">□</div>
        <div class="wc" onclick="window.location.href='../pages/still love u.html'">×</div>
      </div>
    </div>

    <div class="menu">
      <div>File</div>
      <div>View</div>
      <div>Play</div>
      <div>Tools</div>
      <div>Help</div>
    </div>

    <div class="screen-wrap">
      <div class="screen">
        <img id="cover" alt="Movie cover">
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="statusbar" id="statusbar">Ready</div>
    </div>

    <div class="controls">
      <div class="big-controls">
        <button class="btn" id="prevBtn" title="Previous Movie (Left Arrow)">⏮</button>
        <button class="btn play" id="playBtn" title="Play / Pause (Spacebar)">▶</button>
        <button class="btn" id="nextBtn" title="Next Movie (Right Arrow)">⏭</button>
      </div>
      <div class="bottom-row">
        <div class="seek-wrap">
          <div class="label" id="trackLabel">Playback Progress</div>
          <div class="seek" id="seekBar" aria-label="playback seek bar">
            <div class="seek-bar" id="progressBar"></div>
          </div>
        </div>
        <div class="hint">Use Arrow keys & Spacebar to control</div>
      </div>
    </div>
  </div>

  <script>
    const movies = [
      { title: "H2O", year: "2015", cover: "../images/movie covers/h2o.jpg" },
      { title: "Nimona", year: "2023", cover: "../images/movie covers/nimona.jpg" },
      { title: "Umbrella Academy", year: "2019", cover: "../images/movie covers/umbrella_academy.jpg" },
      { title: "Wendell & Wild", year: "2022", cover: "../images/movie covers/wendell_and_wild.jpg" },
      { title: "Dracula: Series", year: "2022", cover: "../images/movie covers/dracula.jpg" },
      { title: "Van Helsing", year: "2004", cover: "../images/movie covers/van_helsing.jpg" },
      { title: "Das Labyrinth", year: "1986", cover: "../images/movie covers/das_labyrinth.jpg" }, 
      { title: "Edward Scissorhands", year: "1990", cover: "../images/movie covers/edward_scissorhands.jpg" },
      { title: "Frankenweenie", year: "2012", cover: "../images/movie covers/frankenweenie.jpg" },
      { title: "Miss Peregrine's Home for Peculiar Children", year: "2016", cover: "../images/movie covers/miss_peregrines.jpg" },
      { title: "Sleepy Hollow", year: "1999", cover: "../images/movie covers/sleepy_hollow.jpg" },
      { title: "Beetlejuice", year: "1988", cover: "../images/movie covers/beetlejuice.jpg" },
      { title: "Sweeney Todd", year: "2007", cover: "../images/movie covers/sweeney_todd.jpg" }
    ];

    const cover = document.getElementById("cover");
    const overlay = document.getElementById("overlay");
    const statusbar = document.getElementById("statusbar");
    const prevBtn = document.getElementById("prevBtn");
    const playBtn = document.getElementById("playBtn");
    const nextBtn = document.getElementById("nextBtn");
    const seekBar = document.getElementById("seekBar");
    const progressBar = document.getElementById("progressBar");
    const trackLabel = document.getElementById("trackLabel");

    let current = 0;
    let playing = false;
    let progressInterval = null;
    let currentProgress = 0;

    function updatePlayer() {
      const movie = movies[current];
      cover.src = movie.cover;
      cover.alt = movie.title;
      overlay.innerHTML = `<strong>${movie.title}</strong> (${movie.year})`;
      
      if (playing) {
        statusbar.textContent = `Playing: ${movie.title}`;
        playBtn.textContent = "❚❚";
        startProgress();
      } else {
        statusbar.textContent = "Paused";
        playBtn.textContent = "▶";
        stopProgress();
      }
    }

    function startProgress() {
      stopProgress();
      progressInterval = setInterval(() => {
        if (currentProgress >= 100) {
          currentProgress = 0;
          nextBtn.click();
        } else {
          currentProgress += 0.5;
          progressBar.style.width = `${currentProgress}%`;
          trackLabel.textContent = `Playback Progress: ${Math.floor(currentProgress)}%`;
        }
      }, 100);
    }

    function stopProgress() {
      clearInterval(progressInterval);
    }

    seekBar.addEventListener("click", (e) => {
      const rect = seekBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      currentProgress = (clickX / width) * 100;
      progressBar.style.width = `${currentProgress}%`;
      trackLabel.textContent = `Playback Progress: ${Math.floor(currentProgress)}%`;
    });

    prevBtn.addEventListener("click", () => {
      currentProgress = 0;
      progressBar.style.width = "0%";
      current = (current - 1 + movies.length) % movies.length;
      updatePlayer();
    });

    nextBtn.addEventListener("click", () => {
      currentProgress = 0;
      progressBar.style.width = "0%";
      current = (current + 1) % movies.length;
      updatePlayer();
    });

    playBtn.addEventListener("click", () => {
      playing = !playing;
      updatePlayer();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") prevBtn.click();
      if (e.key === "ArrowRight") nextBtn.click();
      if (e.key === " ") {
        e.preventDefault();
        playBtn.click();
      }
    });

    updatePlayer();
    statusbar.textContent = "Ready";
  </script>
</body>
</html>
